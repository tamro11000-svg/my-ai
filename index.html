<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My AI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<title>My AI</title>
<style id="base-css">
:root{
  --bg:#0d0f14; --panel:#14171f; --panel2:#1b1f2a; --line:#272c3a; --text:#e9ebf1; --muted:#8c94aa;
  --accent:#f5b942; --accent-ink:#1a1204; --good:#4ade80; --bad:#f87171; --user:#2a3350;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f6fa;--panel:#ffffff;--panel2:#eef0f6;--line:#d9dde8;--text:#171a22;--muted:#5d6579;--user:#dbe4ff;--accent-ink:#1a1204}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#6db7ff}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:920px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#f5b942,#f08a3c);display:grid;place-items:center;color:var(--accent-ink);font-weight:800}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;min-width:0}
.brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{flex:1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:650}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5}
main{flex:1;min-height:0;position:relative}
.panel{display:none;position:absolute;inset:0;overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.panel.on{display:flex;flex-direction:column}
#p-chat{padding:0}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:88%;padding:9px 13px;border-radius:15px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center;border:1px dashed var(--line)}
.msg.error{align-self:center;color:#fecaca;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);font-size:13.5px}
.msg pre{background:#0b0d12;color:#d5d9e8;border:1px solid var(--line);padding:10px;border-radius:9px;overflow:auto;font:12.5px/1.5 var(--mono)}
.msg code{font:12.8px var(--mono);background:rgba(127,127,127,.18);padding:1px 5px;border-radius:5px}
.msg pre code{background:none;padding:0}
.msg .li{display:block;padding-left:4px}
.tool{align-self:flex-start;max-width:92%;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--panel);cursor:pointer}
.tool .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;animation:blink 1s infinite}
.tool.ok .dot{background:var(--good);animation:none}
.tool.err .dot{background:var(--bad);animation:none}
.tool pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font:11.5px/1.45 var(--mono);color:var(--text);max-height:220px;overflow:auto}
@keyframes blink{50%{opacity:.25}}
#suggest{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px}
.chip:hover{border-color:var(--accent)}
#composer{display:flex;gap:9px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
#input{flex:1;resize:none;max-height:170px;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;outline:none;font-size:16px}
#input:focus{border-color:var(--accent)}
#send{min-height:44px;padding:0 18px}
#nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
#nav button{flex:1;background:none;border:0;padding:11px 2px 10px;color:var(--muted);font-size:12.5px;font-weight:600;border-top:2px solid transparent}
#nav button.on{color:var(--text);border-top-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px;font-weight:600}
.f{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;font-size:16px}
.f:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{color:var(--muted);font-size:12px}
.item.click{cursor:pointer}
.badge{font-size:10.5px;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;background:var(--panel2);color:var(--muted)}
.badge.core{background:rgba(248,113,113,.15);color:var(--bad)}
.badge.tool{background:rgba(94,234,212,.15);color:#2fb9a4}
.badge.css{background:rgba(197,139,255,.15);color:#a96ee8}
.badge.instructions{background:rgba(245,185,66,.18);color:#c98f1a}
.none{color:var(--muted);text-align:center;padding:26px 10px}
.banner{padding:9px 12px;border-radius:11px;margin-bottom:10px;font-size:13.5px;background:rgba(245,185,66,.12);border:1px solid rgba(245,185,66,.35)}
.banner.bad{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column}
.sheet h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.sheet .body{padding:14px 18px;overflow:auto}
.sheet .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.diff{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
.diff div{padding:0 6px}
.diff .a{background:rgba(74,222,128,.14)}
.diff .r{background:rgba(248,113,113,.14)}
.diff .g{color:var(--muted)}
iframe.prev{width:100%;height:55vh;border:1px solid var(--line);border-radius:10px;background:#fff}
pre.view{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 var(--mono)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:99px;font-size:13.5px;display:none;z-index:30;max-width:90vw}
@media (max-width:600px){
  .modal{padding:0;align-items:flex-end}
  .sheet{border-radius:18px 18px 0 0;width:100%}
  .msg{max-width:94%}
}
</style>

<body>
<div id="app"></div>
<div class="modal" id="modal"></div>
<div id="toast"></div>
<script type="text/plain" id="core-src">
'use strict';
/* ===== helpers ===== */
const VERSION = '1.0';
const MAX_STEPS = 25;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clip = (s, n) => { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + '… [+' + (s.length - n) + ' chars]' : s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10);
const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
const fmtTime = (ts) => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtSize = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB');
const kvGet = (k, d) => BOOT.get('kv', k).then((v) => (v === undefined ? d : v));
const kvSet = (k, v) => BOOT.set('kv', k, v);
const kvDel = (k) => BOOT.del('kv', k);

function md(src) {
  const blocks = [];
  src = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, l, c) => { blocks.push('<pre><code>' + esc(c.replace(/\n$/, '')) + '</code></pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  let h = esc(src);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^#{1,4}\s+(.+)$/gm, '<strong>$1</strong>')
    .replace(/^\s*[-*]\s+(.+)$/gm, '<span class="li">• $1</span>')
    .replace(/^\s*(\d+)\.\s+(.+)$/gm, '<span class="li">$1. $2</span>')
    .replace(/\n/g, '<br>').replace(/(<\/span>|<\/strong>|<\/pre>)<br>/g, '$1');
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
}

function diffText(a, b) {
  const A = a.split('\n'), B = b.split('\n');
  let s = 0; while (s < A.length && s < B.length && A[s] === B[s]) s++;
  let ea = A.length, eb = B.length; while (ea > s && eb > s && A[ea - 1] === B[eb - 1]) { ea--; eb--; }
  const x = A.slice(s, ea), y = B.slice(s, eb), n = x.length, m = y.length, ops = [];
  if (n * m > 4e6) { x.forEach((l) => ops.push(['-', l])); y.forEach((l) => ops.push(['+', l])); }
  else {
    const w = m + 1, dp = new Uint16Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i * w + j] = x[i] === y[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) { if (x[i] === y[j]) { ops.push([' ', x[i]]); i++; j++; } else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) ops.push(['-', x[i++]]); else ops.push(['+', y[j++]]); }
    while (i < n) ops.push(['-', x[i++]]);
    while (j < m) ops.push(['+', y[j++]]);
  }
  const keep = ops.map(() => false);
  ops.forEach((o, k) => { if (o[0] !== ' ') for (let q = Math.max(0, k - 1); q <= Math.min(ops.length - 1, k + 1); q++) keep[q] = true; });
  const out = []; let gap = false;
  ops.forEach((o, k) => { if (keep[k]) { if (gap) out.push(['@', '…']); gap = false; out.push(o); } else gap = true; });
  return out;
}

/* ===== settings ===== */
const PRESETS = {
  gemini: { label: 'Google Gemini (free)', baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai', keyUrl: 'https://aistudio.google.com/apikey', note: 'Free key from Google AI Studio. On the free tier Google may use your prompts to improve its products.' },
  groq: { label: 'Groq (free)', baseUrl: 'https://api.groq.com/openai/v1', keyUrl: 'https://console.groq.com/keys', note: 'Free key from Groq. Fast. Choose a model that supports tools.' },
  openrouter: { label: 'OpenRouter (free models)', baseUrl: 'https://openrouter.ai/api/v1', keyUrl: 'https://openrouter.ai/keys', note: 'Free key. Choose a model whose name ends with :free.' },
  custom: { label: 'Other (OpenAI-compatible)', baseUrl: '', keyUrl: '', note: 'Any provider with an OpenAI-style API.' },
};
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let S = Object.assign({ provider: 'gemini', baseUrl: PRESETS.gemini.baseUrl, model: '', name: 'My AI' }, (() => { try { return JSON.parse(ls.get('myai.settings') || '{}'); } catch (e) { return {}; } })());
const saveSettings = () => ls.set('myai.settings', JSON.stringify(S));
const getKey = () => ls.get('myai.key') || '';
const modelId = () => String(S.model || '').replace(/^models\//, '');

/* ===== state ===== */
let staffNotes = {}, history = [], persona = '', memory = '', userTools = {}, css = '', changes = [], stagedCore = null;
let busy = false, abortCtl = null, pendingReload = false;
const notices = [];
const saveHistory = () => kvSet('history', history.slice(-300));

/* ===== files ===== */
const normPath = (p) => {
  p = String(p == null ? '' : p).replace(/\\/g, '/').replace(/^\/+/, '');
  if (!p || p.length > 200 || p.split('/').includes('..')) throw new Error('Invalid file path');
  return p;
};
async function fileRead(p) { const f = await BOOT.get('files', normPath(p)); if (!f) throw new Error('File not found: ' + p); return f.content; }
async function fileWrite(p, content, append) {
  p = normPath(p);
  let c = String(content == null ? '' : content);
  if (append) { const f = await BOOT.get('files', p); if (f) c = f.content + c; }
  await BOOT.set('files', p, { content: c, mtime: Date.now() });
  renderFiles();
  return c.length;
}
async function fileDelete(p) { await BOOT.del('files', normPath(p)); renderFiles(); }
async function fileList() {
  const keys = await BOOT.keys('files'), out = [];
  for (const k of keys) { const f = await BOOT.get('files', k); if (f) out.push({ path: k, size: f.content.length, mtime: f.mtime }); }
  return out.sort((a, b) => b.mtime - a.mtime);
}

/* ===== sandbox (tools run in a Web Worker: no access to your key or the page) ===== */
const WORKER_SRC = [
  'const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;',
  'let rid = 0; const pend = new Map(); const logs = [];',
  'const rpc = (op, a) => new Promise((res, rej) => { const id = ++rid; pend.set(id, { res, rej }); postMessage({ rpc: id, op, a }); });',
  'console.log = (...x) => logs.push(x.map((v) => typeof v === "string" ? v : JSON.stringify(v)).join(" "));',
  'self.onmessage = async (e) => {',
  '  const m = e.data;',
  '  if (m.reply) { const p = pend.get(m.reply); if (p) { pend.delete(m.reply); m.error ? p.rej(new Error(m.error)) : p.res(m.value); } return; }',
  '  try {',
  '    const ctx = { files: { read: (p) => rpc("read", { path: p }), write: (p, c) => rpc("write", { path: p, content: c }), list: () => rpc("list", {}) } };',
  '    const fn = new AsyncFunction("args", "ctx", m.code);',
  '    let out = await fn(m.args, ctx);',
  '    if (out === undefined) out = "";',
  '    postMessage({ done: true, ok: true, out: typeof out === "string" ? out : JSON.stringify(out), logs });',
  '  } catch (err) { postMessage({ done: true, ok: false, error: String(err && err.message || err), logs }); }',
  '};',
].join('\n');

async function workerRpc(op, a) {
  if (op === 'read') return fileRead(a.path);
  if (op === 'write') { await fileWrite(a.path, a.content); return 'ok'; }
  if (op === 'list') return (await fileList()).map((f) => f.path);
  throw new Error('Unknown operation');
}
function runInWorker(code, args, timeoutMs) {
  timeoutMs = timeoutMs || 30000;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    let w;
    try { w = new Worker(url); } catch (e) { URL.revokeObjectURL(url); return reject(new Error('This browser cannot run the sandbox: ' + e.message)); }
    const timer = setTimeout(() => done(reject, new Error('Timed out after ' + timeoutMs / 1000 + ' seconds')), timeoutMs);
    function done(fn, v) { clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); fn(v); }
    w.onerror = (e) => done(reject, new Error(e.message || 'Sandbox error'));
    w.onmessage = async (e) => {
      const m = e.data;
      if (m.rpc) {
        try { w.postMessage({ reply: m.rpc, value: await workerRpc(m.op, m.a) }); }
        catch (err) { w.postMessage({ reply: m.rpc, error: String(err.message || err) }); }
      } else if (m.done) {
        const logs = m.logs && m.logs.length ? '\n[console]\n' + m.logs.join('\n') : '';
        if (m.ok) done(resolve, m.out + logs); else done(reject, new Error(m.error + logs));
      }
    };
    w.postMessage({ code: code, args: args || {} });
  });
}

/* ===== built-in tools ===== */
function stripHtml(t) {
  try { const d = new DOMParser().parseFromString(t, 'text/html'); $$('script,style,noscript', d).forEach((n) => n.remove()); return (d.body.textContent || '').replace(/\s+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim(); }
  catch (e) { return t; }
}
function timeoutSignal(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }
const OBJ = (props, req) => ({ type: 'object', properties: props, required: req || [] });
const T = {
  write_file: {
    description: 'Create or overwrite a text file in the owner\'s Files tab (use for every deliverable: reports, plans, code, web pages like site/index.html). Set append=true to add to a file.',
    parameters: OBJ({ path: { type: 'string' }, content: { type: 'string' }, append: { type: 'boolean' } }, ['path', 'content']),
    run: async (a) => 'Saved ' + normPath(a.path) + ' (' + (await fileWrite(a.path, a.content, a.append)) + ' characters).',
  },
  read_file: { description: 'Read a text file from the Files tab.', parameters: OBJ({ path: { type: 'string' } }, ['path']), run: async (a) => clip(await fileRead(a.path), 30000) },
  list_files: { description: 'List the files in the Files tab.', parameters: OBJ({}), run: async () => { const f = await fileList(); return f.length ? f.map((x) => x.path + ' (' + x.size + ' chars)').join('\n') : '(no files yet)'; } },
  delete_file: { description: 'Delete a file from the Files tab.', parameters: OBJ({ path: { type: 'string' } }, ['path']), run: async (a) => { await fileDelete(a.path); return 'Deleted ' + a.path; } },
  run_js: {
    description: 'Run JavaScript in a safe sandbox to calculate or process data. The code is the body of an async function: use return to output a result. console.log is captured. fetch is available (the browser only allows sites that permit it). ctx.files.read/write/list reach the Files tab.',
    parameters: OBJ({ code: { type: 'string' } }, ['code']),
    run: async (a) => runInWorker(a.code, {}),
  },
  fetch_url: {
    description: 'Read a web address and return its text. Browsers only allow sites that permit it (many public APIs do, many websites do not).',
    parameters: OBJ({ url: { type: 'string' }, method: { type: 'string' }, body: { type: 'string' } }, ['url']),
    run: async (a) => {
      const u = String(a.url || '');
      if (!/^https?:\/\//i.test(u)) throw new Error('Only http(s) addresses');
      try {
        const r = await fetch(u, { method: a.method || 'GET', body: a.body || undefined, credentials: 'omit', signal: timeoutSignal(25000) });
        const t = await r.text(), ct = r.headers.get('content-type') || '';
        return 'HTTP ' + r.status + '\n' + clip(/html/i.test(ct) ? stripHtml(t) : t, 20000);
      } catch (e) { throw new Error('The browser could not read that address (' + e.message + '). Many websites block browsers. A public API that allows it works, for example Wikipedia: https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=TOPIC&format=json&origin=*'); }
    },
  },
  update_memory: {
    description: 'Rewrite your durable memory about the owner (name, preferences, ongoing projects). Short plain text. Replaces the old memory, so include everything worth keeping.',
    parameters: OBJ({ content: { type: 'string' } }, ['content']),
    run: async (a) => { memory = String(a.content || '').slice(0, 4000); await kvSet('memory', memory); renderChanges(); return 'Memory saved.'; },
  },
};

/* ===== changing myself ===== */
async function recordChange(kind, summary, undo) {
  changes.unshift({ id: uid(), ts: Date.now(), kind: kind, summary: clip(summary || kind, 200), undo: undo || null, undone: false });
  changes = changes.slice(0, 100);
  await kvSet('changes', changes);
  renderChanges();
}
function applyCss() { const el = $('#user-css'); if (el) el.textContent = BOOT.safe ? '' : css; }

async function sendUser(text) {
  text = String(text || '').trim();
  if (!text || busy) return;
  if (!getKey() || !S.model) { showPanel('settings'); toast(!getKey() ? 'Add your API key first' : 'Choose a model first'); return; }
  setBusy(true); abortCtl = new AbortController();
  try {
    const note = notices.splice(0).join('\n');
    history.push({ role: 'user', content: (note ? note + '\n\n' : '') + text });
    addMsg('user', text); updateSuggest(); await saveHistory();
    for (let step = 0; step < MAX_STEPS; step++) {
      setStatus('Thinking…');
      const msg = await chatOnce(trimHistory(), abortCtl.signal);
      const a = { role: 'assistant', content: msg.content || '' };
      if (msg.tool_calls && msg.tool_calls.length) a.tool_calls = msg.tool_calls.map((c) => Object.assign({ id: c.id || 'call_' + uid(), type: 'function', function: { name: c.function.name, arguments: typeof c.function.arguments === 'string' ? c.function.arguments : JSON.stringify(c.function.arguments || {}) } }, c.extra_content ? { extra_content: c.extra_content } : {}));
      history.push(a);
      if (a.content) addMsg('assistant', a.content);
      if (!a.tool_calls) break;
      for (const c of a.tool_calls) {
        const chip = addToolChip(c);
        let result, ok = true;
        setStatus('Using ' + c.function.name + '…');
        try {
          let args = {};
          try { args = JSON.parse(c.function.arguments || '{}'); } catch (e) { throw new Error('The arguments were not valid JSON. Send them again.'); }
          result = await execTool(c.function.name, args);
        } catch (e) { ok = false; result = 'Error: ' + (e && e.message ? e.message : e); }
        result = clip(result, 8000);
        history.push({ role: 'tool', tool_call_id: c.id, name: c.function.name, content: result });
        finishChip(chip, ok, result);
      }
      await saveHistory();
      if (pendingReload) { setStatus('Restarting…'); await sleep(600); location.reload(); return; }
      if (step === MAX_STEPS - 1) addMsg('system', 'I stopped after ' + MAX_STEPS + ' steps to save your free limit. Say "continue" to go on.');
    }
  } catch (e) { addMsg('error', friendlyError(e)); }
  finally { if (!pendingReload) { setBusy(false); await saveHistory(); } }
}

    c.undone = true; await kvSet('changes', changes); toast('Restarting…'); await sleep(500); location.reload(); return;

/* ===== backup ===== */
async function exportBackup() {
  const kv = {}; for (const k of await BOOT.keys('kv')) kv[k] = await BOOT.get('kv', k);
  const files = {}; for (const k of await BOOT.keys('files')) files[k] = await BOOT.get('files', k);
  const data = { app: 'myai', version: VERSION, ts: Date.now(), settings: Object.assign({}, S), kv: kv, files: files };
  download('my-ai-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(data), 'application/json');
  toast('Backup saved. Your API key is NOT included.');
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'myai') throw new Error('This is not a My AI backup file.');
    if (!confirm('Restore this backup? It replaces your current chats, files and changes.')) return;
    for (const k of await BOOT.keys('kv')) await BOOT.del('kv', k);
    for (const k of await BOOT.keys('files')) await BOOT.del('files', k);
    for (const [k, v] of Object.entries(data.kv || {})) await BOOT.set('kv', k, v);
    for (const [k, v] of Object.entries(data.files || {})) await BOOT.set('files', k, v);
    if (data.settings) { S = Object.assign(S, data.settings); saveSettings(); }
    location.reload();
  } catch (e) { toast('Could not restore: ' + e.message); }
}

/* ===== start ===== */
function buildUI() {
  $('#app').innerHTML =
    '<header><div class="brand"><span class="logo">' + esc((S.name || 'A')[0].toUpperCase()) + '</span><b id="aiName">' + esc(S.name) + '</b></div><span id="status"></span><button class="btn" id="newChat">New chat</button></header>' +
    '<main>' +
    '<section class="panel on" id="p-chat"><div id="msgs"></div><div id="suggest"></div><div id="composer"><textarea id="input" rows="1" placeholder="Tell me what to do…"></textarea><button class="btn primary" id="send">Send</button></div></section>' +
    '<section class="panel" id="p-files"></section><section class="panel" id="p-changes"></section><section class="panel" id="p-settings"></section>' +
    '</main>' +
    '<nav id="nav"><button data-p="chat" class="on">Chat</button><button data-p="files">Files</button><button data-p="changes">Changes</button><button data-p="settings">Settings</button></nav>';
  $$('#nav button').forEach((b) => { b.onclick = () => showPanel(b.dataset.p); });
  const input = $('#input');
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(170, input.scrollHeight) + 'px'; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); $('#send').click(); } });
  $('#send').onclick = () => { if (busy) { if (abortCtl) abortCtl.abort(); return; } const t = input.value; input.value = ''; input.style.height = 'auto'; sendUser(t); };
  $('#newChat').onclick = async () => { if (busy) return; if (history.length && !confirm('Start a new chat? Files and changes are kept.')) return; history = []; await saveHistory(); renderHistory(); };
}
async function init() {
  const [h, pe, me, ut, cs, ch, sc] = await Promise.all([kvGet('history', []), kvGet('persona', ''), kvGet('memory', ''), kvGet('tools', {}), kvGet('css', ''), kvGet('changes', []), kvGet('core.staged', null)]);
  try { staffNotes = (await kvGet('staff', {})) || {}; } catch (e) { staffNotes = {}; }
  history = h; persona = pe; memory = me; userTools = ut; css = cs; changes = ch; stagedCore = sc;
  buildUI(); applyCss(); renderHistory();
  document.title = S.name;
  if (BOOT.failure) {
    const f = BOOT.failure, c = changes.find((x) => x.kind === 'core' && !x.undone); if (c) c.undone = true;
    changes.unshift({ id: uid(), ts: Date.now(), kind: 'core', summary: 'Rolled back automatically: ' + (f.summary || 'core change') + ' (' + (f.error || 'failed to start') + ')', undo: null, undone: true });
    await kvSet('changes', changes);
    addMsg('system', 'My last core change failed to start and was rolled back automatically. Everything works as before.');
    notices.push('[APP NOTICE] Your last core change "' + (f.summary || '') + '" failed to start (' + (f.error || '') + ') and was rolled back automatically.');
  }
  if (BOOT.safe) addMsg('system', 'Safe mode: my core changes and custom look are switched off.');
  await BOOT.healthy();
  if (BOOT.justApplied) { addMsg('system', 'Core change applied and running fine.'); notices.push('[APP NOTICE] Your core change was applied and the app restarted successfully.'); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (!getKey() || !S.model) {
    showPanel('settings');
    addMsg('system', 'Welcome. Open Settings, pick a free provider, paste its key, then tap Save and test.');
  }
  renderFiles(); renderChanges();
}
return init();

</script>
<script>
/* BOOT LOADER. Small, fixed, and never changed by the AI.
 * It stores data, starts the app core, and rolls back a changed core that fails to start.
 * Add #safe to the address to ignore all core changes. */
(function () {
  'use strict';
  var BOOT = { safe: /(^|[#?&])safe(\b|=)/.test(location.hash + location.search), usingOverride: false, failure: null, persistent: true };
  window.BOOT = BOOT;

  // ---- storage: IndexedDB, with an in-memory fallback (private browsing) ----
  var mem = { kv: new Map(), files: new Map() };
  var dbp = new Promise(function (resolve) {
    try {
      var r = indexedDB.open('myai', 1);
      r.onupgradeneeded = function () {
        var d = r.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('files')) d.createObjectStore('files');
      };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { resolve(null); };
      r.onblocked = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });
  function op(store, mode, f, memf) {
    return dbp.then(function (db) {
      if (!db) { BOOT.persistent = false; return memf(mem[store]); }
      return new Promise(function (resolve, reject) {
        var t = db.transaction(store, mode), req = f(t.objectStore(store));
        t.oncomplete = function () { resolve(req.result); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error || new Error('Storage write was cancelled')); };
      });
    });
  }
  BOOT.get = function (s, k) { return op(s, 'readonly', function (o) { return o.get(k); }, function (m) { return m.get(k); }); };
  BOOT.set = function (s, k, v) { return op(s, 'readwrite', function (o) { return o.put(v, k); }, function (m) { m.set(k, v); }); };
  BOOT.del = function (s, k) { return op(s, 'readwrite', function (o) { return o.delete(k); }, function (m) { m.delete(k); }); };
  BOOT.keys = function (s) { return op(s, 'readonly', function (o) { return o.getAllKeys(); }, function (m) { return Array.from(m.keys()); }); };
  BOOT.wipe = function () {
    return dbp.then(function (db) { if (db) db.close(); return new Promise(function (res) { try { var q = indexedDB.deleteDatabase('myai'); q.onsuccess = q.onerror = q.onblocked = function () { res(); }; } catch (e) { res(); } }); });
  };

  // ---- reload-loop guard: after repeated failed starts, force safe mode ----
  try {
    var n = Number(sessionStorage.getItem('myai.boot') || 0) + 1;
    sessionStorage.setItem('myai.boot', String(n));
    if (n >= 5) BOOT.safe = true;
  } catch (e) {}

  function fatal(msg) {
    document.body.innerHTML = '<div style="max-width:520px;margin:12vh auto;padding:0 20px;font:16px/1.5 system-ui,sans-serif;color:#e9ebf1">' +
      '<h2>My AI could not start</h2><p>' + String(msg).replace(/[<>&]/g, '') + '</p>' +
      '<p>Try reloading. If it keeps failing, open the address with <b>#safe</b> at the end.</p></div>';
  }
  function failOverride(why) {
    BOOT.get('kv', 'core.override').then(function (ov) {
      if (!ov) return;
      ov.status = 'failed'; ov.error = why;
      return BOOT.set('kv', 'core.override', ov);
    }).catch(function () {}).then(function () { location.reload(); });
  }
  function onCoreError(e) {
    console.error(e);
    var why = 'it crashed: ' + (e && e.message ? e.message : e);
    if (BOOT.usingOverride && !window.__healthy) failOverride(why);
    else if (!window.__healthy) fatal(why);
  }

  BOOT.embedded = (document.getElementById('core-src') || {}).textContent || '';

  (function start() {
    var p = BOOT.safe ? Promise.resolve(null) : BOOT.get('kv', 'core.override').catch(function () { return null; });
    p.then(function (ov) {
      var src = BOOT.embedded;
      var fail = Promise.resolve();
      if (ov && ov.status === 'failed') {
        // Go back to the version that was running before this change (or the original core).
        BOOT.failure = ov;
        if (ov.prevCode) {
          ov = { code: ov.prevCode, status: 'ok', ts: ov.ts, summary: ov.prevSummary || '' };
          fail = BOOT.set('kv', 'core.override', ov).catch(function () {});
        } else {
          ov = null;
          fail = BOOT.del('kv', 'core.override').catch(function () {});
        }
      }
      if (ov && ov.code) { src = ov.code; BOOT.usingOverride = true; }
      BOOT.coreSource = src;
      BOOT.override = ov;
      BOOT.healthy = function () {
        window.__healthy = true;
        try { sessionStorage.removeItem('myai.boot'); } catch (e) {}
        window.removeEventListener('error', early);
        window.removeEventListener('unhandledrejection', earlyRej);
        if (BOOT.override && BOOT.override.status === 'pending') {
          BOOT.override.status = 'ok';
          BOOT.justApplied = true;
          return BOOT.set('kv', 'core.override', BOOT.override);
        }
        return Promise.resolve();
      };
      function early(ev) { if (!window.__healthy) failOverride('error: ' + (ev && ev.message ? ev.message : 'unknown')); }
      function earlyRej(ev) { if (!window.__healthy) failOverride('error: ' + (ev && ev.reason && ev.reason.message ? ev.reason.message : 'unknown')); }
      if (BOOT.usingOverride && ov.status === 'pending') {
        window.addEventListener('error', early);
        window.addEventListener('unhandledrejection', earlyRej);
        setTimeout(function () { if (!window.__healthy) failOverride('it did not start within 8 seconds'); }, 8000);
      }
      return fail.then(function () {
        try {
          var r = new Function('BOOT', src)(BOOT);
          if (r && r.catch) r.catch(onCoreError);
        } catch (e) { onCoreError(e); }
      });
    });
  })();
})();

</script>
</body>
